# Nginx Reverse Proxy Configuration for ClipDown Backend (Ubuntu VPS)
# Place in /etc/nginx/sites-available/clipdown and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name api.clipdown.example.com; # Replace with your VPS domain or IP

    # Redirect HTTP to HTTPS (uncomment after obtaining Certbot SSL certificate)
    # return 301 https://$host$request_uri;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for video streaming downloads
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts for video trimming jobs
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
