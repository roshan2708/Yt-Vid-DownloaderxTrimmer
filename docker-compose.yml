services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clipdown-app
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=10000
      - BACKEND_PORT=4000
      - BACKEND_URL=http://127.0.0.1:4000
    expose:
      - "10000"
    shm_size: '1gb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: clipdown-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
